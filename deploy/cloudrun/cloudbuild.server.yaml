steps:
  # ── Build server Docker image ────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/server/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:${_TAG}
      - apps/server
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:${_TAG}
