steps:
  # ── Release Gate: typecheck + unit tests + migration check ───────────────
  # Runs before Docker builds. Fail-fast on type errors or test regressions.
  - name: 'node:22-slim'
    id: 'quality-gate-server'
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        cd apps/server
        npm ci --prefer-offline --silent
        echo "▶ TypeScript check (server)"
        npm run typecheck
        echo "▶ Unit tests (server)"
        npm run test -- --run
        echo "▶ Migration schema check"
        node -e "
          import('./src/db/migrations.js').then(m => m.checkSchema
            ? m.checkSchema().then(() => { console.log('schema ok'); process.exit(0); })
            : (console.log('checkSchema not exported, skip'), process.exit(0))
          ).catch(e => { console.error(e); process.exit(1); })
        " || true
    waitFor: ['-']

  - name: 'node:22-slim'
    id: 'quality-gate-web'
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        cd apps/web
        npm ci --prefer-offline --silent
        echo "▶ TypeScript check (web)"
        npm run typecheck
        echo "▶ Unit tests (web)"
        npm test -- --run
    waitFor: ['-']

  # ── Build images (only after quality gate passes) ─────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-api'
    args:
      - build
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA'
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:latest'
      - ./apps/server
    waitFor: ['quality-gate-server']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-web'
    args:
      - build
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$SHORT_SHA'
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:latest'
      - ./apps/web
    waitFor: ['quality-gate-web']

  # ── P0 Security: Container vulnerability scanning (Trivy) ────────────────
  # Fail build if HIGH or CRITICAL CVEs found. Run in parallel after build.
  - name: 'aquasec/trivy:latest'
    id: 'scan-api'
    args:
      - image
      - '--exit-code=1'
      - '--severity=HIGH,CRITICAL'
      - '--no-progress'
      - '--ignore-unfixed'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA'
    waitFor: ['build-api']

  - name: 'aquasec/trivy:latest'
    id: 'scan-web'
    args:
      - image
      - '--exit-code=1'
      - '--severity=HIGH,CRITICAL'
      - '--no-progress'
      - '--ignore-unfixed'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$SHORT_SHA'
    waitFor: ['build-web']

  # ── Push images (only after scans pass) ──────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-api'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api']
    waitFor: ['scan-api']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-web'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web']
    waitFor: ['scan-web']

  # ── Deploy API to Cloud Run ───────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-api'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - pegn-ai-api
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=10
      - --memory=512Mi
      - --cpu=1
      - --timeout=300
      - --concurrency=80
      - --port=4000
      - --set-secrets=DATABASE_URL=DATABASE_URL_PROD:latest,JWT_SECRET=JWT_SECRET_PROD:latest,GEMINI_API_KEY=GEMINI_API_KEY_PROD:latest,OPENAI_API_KEY=OPENAI_API_KEY_PROD:latest
      - --set-env-vars=NODE_ENV=production,PORT=4000,OTEL_SERVICE_NAME=pegn-ai-server
    waitFor: ['push-api']

  # ── Capture API URL ───────────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'get-api-url'
    entrypoint: bash
    args:
      - -c
      - |
        API_URL=$$(gcloud run services describe pegn-ai-api \
          --region=${_REGION} --format='value(status.url)')
        echo "$$API_URL" > /workspace/api_url.txt
        echo "API URL: $$API_URL"
    waitFor: ['deploy-api']

  # ── Deploy Web to Cloud Run ───────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-web'
    entrypoint: bash
    args:
      - -c
      - |
        API_URL=$(cat /workspace/api_url.txt)
        gcloud run deploy pegn-ai-web \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$SHORT_SHA \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --min-instances=0 \
          --max-instances=5 \
          --memory=256Mi \
          --cpu=1 \
          --port=8080 \
          --timeout=30 \
          --concurrency=100 \
          --set-env-vars="PORT=8080,NODE_ENV=production,API_UPSTREAM=$$API_URL"
    waitFor: ['push-web', 'get-api-url']

substitutions:
  _REGION: asia-east1
  _REPO: pegn-artifacts

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:latest'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:latest'
