name: CI / CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      # ── Typecheck ──────────────────────────────────────────────────
      - name: Typecheck (server)
        working-directory: ./apps/server
        run: npm run typecheck

      - name: Typecheck (web)
        working-directory: ./apps/web
        run: npm run typecheck

      # ── Tests ──────────────────────────────────────────────────────
      - name: Unit Tests (server)
        working-directory: ./apps/server
        run: npm run test

      - name: Unit Tests (web)
        working-directory: ./apps/web
        run: npm run test -- --run

      # ── Build ──────────────────────────────────────────────────────
      - name: Build (server)
        working-directory: ./apps/server
        run: npm run build

      - name: Build (web)
        working-directory: ./apps/web
        run: npm run build

  docker-build:
    name: Docker Image Build (PR smoke test)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/server
          push: false
          tags: pegn-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: false
          tags: pegn-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Cloud Run (asia-east1)
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      id-token: write   # Required for Workload Identity Federation

    env:
      REGION: ${{ vars.GCP_REGION || 'asia-east1' }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REPO: pegn-ai

    steps:
      - uses: actions/checkout@v4

      # ── Authenticate via Workload Identity Federation ───────────────
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # ── Build & push API image ──────────────────────────────────────
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/server
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/api:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Build & push Web image ──────────────────────────────────────
      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/web:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Deploy API ──────────────────────────────────────────────────
      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy pegn-ai-api \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/api:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=10 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=300 \
            --concurrency=80 \
            --port=4000 \
            --set-secrets=DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,REDIS_URL=REDIS_URL:latest \
            --set-env-vars=NODE_ENV=production,PORT=4000,OTEL_SERVICE_NAME=pegn-ai-server \
            --project=${{ env.PROJECT_ID }}

      - name: Get API URL
        id: api-url
        run: |
          API_URL=$(gcloud run services describe pegn-ai-api \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          echo "url=$API_URL" >> $GITHUB_OUTPUT
          echo "API URL: $API_URL"

      # ── Deploy Web ──────────────────────────────────────────────────
      - name: Deploy Web to Cloud Run
        run: |
          gcloud run deploy pegn-ai-web \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/web:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=5 \
            --memory=256Mi \
            --cpu=1 \
            --port=8080 \
            --timeout=30 \
            --concurrency=100 \
            --set-env-vars="PORT=8080,NODE_ENV=production,API_UPSTREAM=${{ steps.api-url.outputs.url }}" \
            --project=${{ env.PROJECT_ID }}

      - name: Print Web URL
        run: |
          WEB_URL=$(gcloud run services describe pegn-ai-web \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          echo "✅ Deployed → $WEB_URL"
